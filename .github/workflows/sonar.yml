name: SonarQube Cloud

on:
  push:
    branches: [main, antes, despues]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarqube:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias y correr tests (solo si hay tests)
        run: |
          pip install -r requirements.txt
          if [ -f test_app.py ]; then pytest --cov=app --cov-report=xml; fi

      - name: Scan con SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
